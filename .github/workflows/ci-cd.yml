name: CI & Portable Multi-Platform Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  test:
    name: Run Tests & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

  package-windows:
    name: Package Windows Edition (.exe)
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Package Portable Windows Edition
        run: npm run package:portable

      - name: Upload Windows Release Assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/PerfumePrompt.exe
            dist/PerfumePrompt-Portable.zip

  package-linux:
    name: Package Linux Edition (.tar.gz)
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Package Portable Linux Edition
        run: npm run package:portable

      - name: Upload Linux Release Assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist/PerfumePrompt-linux-x64.tar.gz

  release:
    name: Publish GitHub Release
    needs: [package-windows, package-linux]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Determine Tag Name
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "title=Release ${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "title=Perfume Prompt Preparer (Latest)" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.inputs.tag_name || 'latest' }}" >> $GITHUB_OUTPUT
            echo "title=Perfume Prompt Preparer (${{ github.event.inputs.tag_name || 'latest' }})" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.title }}
          make_latest: true
          files: |
            dist/PerfumePrompt.exe
            dist/PerfumePrompt-Portable.zip
            dist/PerfumePrompt-linux-x64.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### Perfume Prompt Preparer - Multi-Platform Distribution

            #### 🪟 Windows Users
            * **Option 1: Single-File Self-Updating Launcher (Recommended)**
              1. Download **`PerfumePrompt.exe`**.
              2. Double-click it. It automatically manages updates, launches the local server, and opens your browser to `http://localhost:3000`.
            * **Option 2: Offline Standalone ZIP**
              1. Download and extract **`PerfumePrompt-Portable.zip`**.
              2. Run **`PerfumePrompt.exe`** (or `start.bat`) inside the extracted folder.

            ---

            #### 🐧 Linux Users (x64)
            * **Zero-Install Portable Tarball**
              1. Download **`PerfumePrompt-linux-x64.tar.gz`**.
              2. Extract: `tar -xzf PerfumePrompt-linux-x64.tar.gz`
              3. Run: `./PerfumePrompt-linux-x64/start.sh`
              *(Includes pre-bundled Node.js runtime; no installation required).*
