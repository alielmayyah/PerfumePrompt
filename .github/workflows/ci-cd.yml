name: CI & Portable Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  test:
    name: Run Tests & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

  release:
    name: Build & Publish Portable Release (.exe)
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Package Portable Windows Edition
        run: npm run package:portable

      - name: Determine Tag Name
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.inputs.tag_name || 'v1.0.0' }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Perfume Prompt Preparer ${{ steps.vars.outputs.tag }}
          files: |
            dist/PerfumePrompt.exe
            dist/PerfumePrompt-Portable.zip
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### Perfume Prompt Preparer - Windows Desktop Edition

            #### Option A: Single-File Self-Updating Launcher (Recommended)
            1. Download **`PerfumePrompt.exe`**.
            2. Double-click it. It automatically downloads the latest release, keeps itself updated on every run, and opens `http://localhost:3000`.
            *No manual extraction or unzipping required.*

            #### Option B: Offline Portable Package
            1. Download and extract **`PerfumePrompt-Portable.zip`**.
            2. Double-click **`PerfumePrompt.exe`** (or `start.bat`) inside the folder.
